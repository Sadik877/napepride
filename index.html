<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Napep Ride - Waitlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#000000',
                        foreground: '#FFFFFF',
                        accent: '#FFD700',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #mobile-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            background-color: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>

<div id="mobile-container">
    <main class="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-12">
        <div class="relative w-48 h-48 mx-auto flex items-center justify-center">
            <div class="absolute inset-0 bg-accent rounded-full opacity-10 animate-pulse"></div>
            <!-- Try to load actual logo, fallback to text -->
            <img src="napepride_logo.png" alt="Napep Ride" class="w-32 h-32 object-contain relative z-10" 
                 style="mix-blend-mode: screen; filter: grayscale(100%) contrast(200%);"
                 onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';" />
            <div id="logo-fallback" class="hidden w-32 h-32 bg-accent rounded-full items-center justify-center text-black font-bold text-4xl relative z-10">
                NR
            </div>
        </div>

        <div class="space-y-4">
            <h1 class="text-4xl font-bold tracking-tight">
                Ride like a <span class="text-accent block mt-2">Local.</span>
            </h1>
            <p class="text-gray-400 text-lg max-w-xs mx-auto leading-relaxed">
                The first smart Keke hailing platform. Reliable, safe, and priced right.
            </p>
        </div>

        <div class="w-full max-w-xs mx-auto space-y-4">
            <button onclick="window.openModal()" class="w-full h-14 bg-accent text-black font-bold text-lg rounded-xl active:scale-95 transition-transform">
                Join the Waitlist
            </button>
            <div class="flex gap-4">
                <a href="passenger.html" class="flex-1 flex items-center justify-center h-12 border-2 border-accent text-accent font-bold rounded-xl active:scale-95 transition-transform">
                    Passenger
                </a>
                <a href="driver.html" class="flex-1 flex items-center justify-center h-12 border-2 border-accent text-accent font-bold rounded-xl active:scale-95 transition-transform">
                    Driver
                </a>
            </div>
        </div>
    </main>
</div>

<!-- Waitlist Modal -->
<div id="waitlist-modal" class="modal-overlay">
    <div class="bg-[#111] w-[90%] max-w-sm rounded-2xl p-6 relative border border-gray-800">
        <button onclick="window.closeModal()" class="absolute right-4 top-4 text-gray-400 hover:text-white text-2xl font-light">
            &times;
        </button>
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-white mb-2">Be the first.</h2>
            <p class="text-gray-400 text-sm">Join the exclusive waitlist.</p>
        </div>
        <form class="space-y-4" onsubmit="window.submitWaitlist(event)">
            <div>
                <input id="full-name" type="text" placeholder="Full Name" required
                    class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-colors">
            </div>
            <div>
                <input id="phone-number" type="tel" placeholder="Phone Number" required
                    class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-colors">
            </div>
            <div>
                <select id="user-type" required class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white focus:outline-none focus:border-accent transition-colors appearance-none">
                    <option value="" disabled selected class="text-gray-500">I am a...</option>
                    <option value="passenger">Passenger</option>
                    <option value="driver">Driver</option>
                </select>
            </div>
            <button type="submit" class="w-full h-14 mt-4 bg-accent text-black font-bold text-lg rounded-xl active:scale-95 transition-transform">
                Get Early Access
            </button>
        </form>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
