<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Napep Ride - Driver Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#000000',
                        foreground: '#FFFFFF',
                        accent: '#FFD700',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #mobile-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            background-color: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: hidden;
            overflow-x: hidden;
        }
        /* Toggle Switch styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FFD700;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FFD700;
        }
        
        /* Waitlist Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>

<div id="mobile-container">
    <header class="p-4 flex flex-col gap-4 z-10 bg-black border-b border-gray-900 pb-6">
        <div class="flex items-center justify-between">
            <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-900 text-white">
                &larr;
            </a>
            <span class="font-bold">Driver Terminal</span>
            <div class="w-10"></div>
        </div>
        
        <div class="flex items-center justify-between bg-gray-900 p-4 rounded-2xl">
            <div>
                <p class="text-sm text-gray-400">Current Status</p>
                <p id="status-text" class="text-lg font-bold text-gray-500">Offline</p>
            </div>
            
            <!-- Toggle Switch -->
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" id="toggle" onclick="toggleStatus(this)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200" style="top:2px; left:2px; border-color: #222;" />
                <label for="toggle" class="toggle-label block overflow-hidden h-7 rounded-full bg-gray-700 cursor-pointer transition-colors duration-200" style="width: 3.25rem;"></label>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 overflow-y-auto space-y-4 bg-[#0a0a0a]">
        <h2 class="text-xl font-bold mb-4">Ride Requests</h2>
        
        <div id="empty-state" class="flex flex-col items-center justify-center py-12 text-center">
            <div class="w-16 h-16 bg-gray-900 rounded-full flex items-center justify-center mb-4 text-gray-500 text-2xl">
                &dash;
            </div>
            <p class="text-gray-400 font-medium">You are offline</p>
            <p class="text-sm text-gray-600 mt-1">Go online to receive ride requests</p>
        </div>
        
        <div id="requests-list" class="hidden space-y-4">
            <!-- Simulated Request -->
            <div class="bg-black p-4 rounded-2xl border border-gray-800 animate-pulse">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-sm text-gray-400">Searching for riders...</p>
                    </div>
                </div>
                <div class="h-2 bg-gray-800 rounded overflow-hidden">
                    <div class="h-full bg-accent w-1/3 animate-[pulse_1s_ease-in-out_infinite]"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Waitlist Button -->
    <button onclick="window.openModal()" class="waitlist-fab absolute bottom-6 right-6 z-40 bg-accent text-black px-6 h-14 rounded-full font-bold shadow-lg shadow-accent/20 flex items-center gap-2 active:scale-95 transition-transform border border-black/10">
        <span class="text-xl">&starf;</span>
        Join Waitlist
    </button>
</div>

<!-- Waitlist Modal -->
<div id="waitlist-modal" class="modal-overlay">
    <div class="bg-[#111] w-[90%] max-w-sm rounded-2xl p-6 relative border border-gray-800">
        <button onclick="window.closeModal()" class="absolute right-4 top-4 text-gray-400 hover:text-white text-2xl font-light">
            &times;
        </button>
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-white mb-2">Be the first.</h2>
            <p class="text-gray-400 text-sm">Join the exclusive waitlist.</p>
        </div>
        <form class="space-y-4" onsubmit="window.submitWaitlist(event)">
            <div>
                <input id="full-name" type="text" placeholder="Full Name" required
                    class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-colors">
            </div>
            <div>
                <input id="phone-number" type="tel" placeholder="Phone Number" required
                    class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-colors">
            </div>
            <div>
                <select id="user-type" required class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white focus:outline-none focus:border-accent transition-colors appearance-none">
                    <option value="" disabled selected class="text-gray-500">I am a...</option>
                    <option value="passenger">Passenger</option>
                    <option value="driver">Driver</option>
                </select>
            </div>
            <button type="submit" class="w-full h-14 mt-4 bg-accent text-black font-bold text-lg rounded-xl active:scale-95 transition-transform">
                Get Early Access
            </button>
        </form>
    </div>
</div>

<script>
    function toggleStatus(checkbox) {
        const text = document.getElementById('status-text');
        const emptyState = document.getElementById('empty-state');
        const list = document.getElementById('requests-list');
        
        if(checkbox.checked) {
            checkbox.style.borderColor = '#FFD700';
            text.innerText = 'Online';
            text.classList.remove('text-gray-500');
            text.classList.add('text-accent');
            
            emptyState.style.display = 'none';
            list.style.display = 'block';
        } else {
            checkbox.style.borderColor = '#222';
            text.innerText = 'Offline';
            text.classList.add('text-gray-500');
            text.classList.remove('text-accent');
            
            emptyState.style.display = 'flex';
            list.style.display = 'none';
        }
    }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
