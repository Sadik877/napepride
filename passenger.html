<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Napep Ride - Passenger Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#000000',
                        foreground: '#FFFFFF',
                        accent: '#FFD700',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #mobile-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            background-color: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: hidden;
            overflow-x: hidden;
        }
        /* Waitlist Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>

<div id="mobile-container">
    <header class="p-4 flex items-center justify-between z-10 bg-black border-b border-gray-900">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-900 text-white">
            &larr;
        </a>
        <span class="font-bold">Passenger Demo</span>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 relative flex flex-col">
        <!-- Map Placeholder -->
        <div class="flex-1 bg-gray-900 relative">
            <!-- Simulated map grid -->
            <div class="absolute inset-0" style="background-size: 20px 20px; background-image: linear-gradient(to right, #222 1px, transparent 1px), linear-gradient(to bottom, #222 1px, transparent 1px);"></div>
            <!-- Demo Route -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="text-center p-4 bg-black/80 rounded-xl border border-gray-800 backdrop-blur-sm">
                    <p class="text-accent font-bold mb-1">Interactive Map</p>
                    <p class="text-xs text-gray-400">Map loads here in full version</p>
                </div>
            </div>
        </div>

        <!-- Bottom Sheet UI -->
        <div class="bg-black border-t border-gray-800 rounded-t-3xl p-6 space-y-6 shadow-2xl relative z-10 -mt-6 pb-12">
            <div class="w-12 h-1.5 bg-gray-800 rounded-full mx-auto -mt-2 mb-4"></div>
            
            <div class="space-y-3 relative">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-accent rounded-full"></div>
                    <input type="text" placeholder="Current Location" class="flex-1 bg-gray-900 text-white px-4 h-12 rounded-xl focus:outline-none focus:ring-1 focus:ring-accent" />
                </div>
                <div class="absolute left-[5px] top-[20px] bottom-[20px] w-0.5 bg-gray-800"></div>
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-white rounded-none border border-black"></div>
                    <input type="text" placeholder="Where to?" class="flex-1 bg-gray-900 text-white px-4 h-12 rounded-xl focus:outline-none focus:ring-1 focus:ring-accent" />
                </div>
            </div>

            <button onclick="alert('This is a UI demo! Sign up for the waitlist to access rides.')" class="w-full h-14 bg-accent text-black font-bold text-lg rounded-xl active:scale-95 transition-transform">
                Find a Keke
            </button>
        </div>
    </main>

    <!-- Floating Waitlist Button -->
    <button onclick="window.openModal()" class="waitlist-fab absolute bottom-6 right-6 z-40 bg-accent text-black px-6 h-14 rounded-full font-bold shadow-lg shadow-accent/20 flex items-center gap-2 active:scale-95 transition-transform border border-black/10">
        <span class="text-xl">&starf;</span>
        Join Waitlist
    </button>
</div>

<!-- Waitlist Modal -->
<div id="waitlist-modal" class="modal-overlay">
    <div class="bg-[#111] w-[90%] max-w-sm rounded-2xl p-6 relative border border-gray-800">
        <button onclick="window.closeModal()" class="absolute right-4 top-4 text-gray-400 hover:text-white text-2xl font-light">
            &times;
        </button>
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-white mb-2">Be the first.</h2>
            <p class="text-gray-400 text-sm">Join the exclusive waitlist.</p>
        </div>
        <form class="space-y-4" onsubmit="window.submitWaitlist(event)">
            <div>
                <input id="full-name" type="text" placeholder="Full Name" required
                    class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-colors">
            </div>
            <div>
                <input id="phone-number" type="tel" placeholder="Phone Number" required
                    class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-colors">
            </div>
            <div>
                <select id="user-type" required class="w-full h-14 px-4 bg-black border border-gray-800 rounded-xl text-white focus:outline-none focus:border-accent transition-colors appearance-none">
                    <option value="" disabled selected class="text-gray-500">I am a...</option>
                    <option value="passenger">Passenger</option>
                    <option value="driver">Driver</option>
                </select>
            </div>
            <button type="submit" class="w-full h-14 mt-4 bg-accent text-black font-bold text-lg rounded-xl active:scale-95 transition-transform">
                Get Early Access
            </button>
        </form>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
